<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Watch - 4metube</title>

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' https://www.youtube.com;
    img-src 'self' data: https://i.ytimg.com;
    frame-src https://www.youtube.com;
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    object-src 'none';
    base-uri 'self';
  ">

  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />

  <link rel="icon" type="image/png" sizes="32x32" href="image/4metube_icon_32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="image/4metube_icon_192.png" />
  <link rel="apple-touch-icon" href="image/4metube_icon_192.png" />

  <style>
    :root {
      --app-vh: 100vh;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      overscroll-behavior: none;
    }

    body.page-watch {
      background: #000;
      touch-action: pan-y;
    }

    #videoContainer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: var(--app-vh);
      overflow-y: scroll;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      overscroll-behavior-y: contain;
      background: #000;
      -webkit-overflow-scrolling: touch;
    }

    @supports (height: 100svh) {
      #videoContainer {
        height: 100svh;
      }
    }

    .video {
      width: 100vw;
      height: var(--app-vh);
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    @supports (height: 100svh) {
      .video {
        height: 100svh;
      }
    }

    .video iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .thumb {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .thumb img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      border: 0;
    }

    .playhint {
      position: absolute;
      left: 50%;
      bottom: calc(16px + var(--safe-bottom));
      transform: translateX(-50%);
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 13px;
      line-height: 1.25;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }

    .sound-tip {
      position: absolute;
      left: 50%;
      top: calc(12px + var(--safe-top));
      transform: translateX(-50%);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 12px;
      line-height: 1.25;
      z-index: 30;
      white-space: nowrap;
      pointer-events: none;
    }

    .gesture-capture {
      position: absolute;
      inset: 0;
      z-index: 25;
      background: transparent;
      cursor: pointer;
    }

    .gesture-capture.hidden,
    .sound-tip.hidden {
      display: none !important;
    }

    .empty-row {
      width: 100%;
      height: var(--app-vh);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #d4d4d4;
      background: #000;
      font-size: 16px;
      line-height: 1.6;
    }

    @supports (height: 100svh) {
      .empty-row {
        height: 100svh;
      }
    }

    .ua-sbrowser #videoContainer {
      height: var(--snap-h, var(--app-vh));
    }

    .ua-sbrowser .video,
    .ua-sbrowser .empty-row {
      height: var(--snap-h, var(--app-vh));
    }
  </style>
</head>

<body class="page-watch">
  <main id="videoContainer" aria-live="polite"></main>

  <script type="module" src="js/watch.js"></script>
</body>
</html>
